function selectSegment(value, fit=true){
  routeGroup.clearLayers();
  if(value==='all'){
    Object.values(routeLayers).forEach(l=>l.addTo(routeGroup));
  } else if(routeLayers[value]){
    routeLayers[value].addTo(routeGroup);
  }
  if(fit && routeGroup.getLayers().length) map.fitBounds(routeGroup.getBounds(),{padding:[35,35]});
}

// GPS do aparelho/navegador. O usuário precisa autorizar o acesso à localização.
let gpsMarker=null, accuracyCircle=null, watchId=null;
const gpsIcon=L.divIcon({className:'',html:'<div class="gpsPulse"></div>',iconSize:[24,24],iconAnchor:[12,12]});

// Índice simplificado da rota para estimar posição/km em tempo real.
const flatRoute=[];
let runningKm=0;
function hdist(a,b){
  const R=6371.0088, d2r=Math.PI/180;
  const la1=a[0]*d2r, la2=b[0]*d2r, dlat=(b[0]-a[0])*d2r, dlon=(b[1]-a[1])*d2r;
  const h=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
Object.entries(routes).forEach(([seg,arr])=>{
  arr.forEach((ll,j)=>{
    if(flatRoute.length) runningKm += hdist(flatRoute[flatRoute.length-1].ll,ll);
    flatRoute.push({ll:ll,km:runningKm,seg:seg});
  });
});
function nearestRoute(lat,lon){
  let best=null, bestD=Infinity;
  // Route is downsampled, still dense enough for on-course display.
  for(let i=0;i<flatRoute.length;i++){
    const d=hdist([lat,lon],flatRoute[i].ll);
    if(d<bestD){bestD=d;best=flatRoute[i];}
  }
  return {point:best,d:bestD};
}
function updateNav(lat,lon){
  const n=nearestRoute(lat,lon);
  if(!n.point) return;
  const km=n.point.km;
  let next=pts.find(p=>p.km>km+0.05) || pts[pts.length-1];
  document.getElementById('curKm').textContent=km.toFixed(1).replace('.',',')+' km';
  document.getElementById('remainKm').textContent=Math.max(0,1007.2-km).toFixed(1).replace('.',',')+' km';
  document.getElementById('nextName').textContent=next.name;
  document.getElementById('nextDist').textContent=Math.max(0,next.km-km).toFixed(1).replace('.',',')+' km';
  document.getElementById('offRoute').textContent=n.d<1 ? Math.round(n.d*1000)+' m' : n.d.toFixed(1).replace('.',',')+' km';
  // Automatically select the segment containing the nearest route point, but only if user chooses follow GPS.
  if(document.getElementById('followGps').checked){
    const radio=[...document.querySelectorAll('input[name="seg"]')].find(r=>r.value===n.point.seg);
    if(radio && !radio.checked){ radio.checked=true; selectSegment(n.point.seg,false); }
  }
}
function showPos(pos){
  const ll=[pos.coords.latitude,pos.coords.longitude];
  updateNav(pos.coords.latitude,pos.coords.longitude);
  if(!gpsMarker){
    gpsMarker=L.marker(ll,{icon:gpsIcon,zIndexOffset:2000}).addTo(map).bindPopup('Você está aqui');
    accuracyCircle=L.circle(ll,{radius:pos.coords.accuracy||0,weight:1,fillOpacity:.08}).addTo(map);
  } else {
    gpsMarker.setLatLng(ll);
    accuracyCircle.setLatLng(ll).setRadius(pos.coords.accuracy||0);
  }
  gpsMarker.bindPopup(`Você está aqui<br>Precisão aproximada: ${Math.round(pos.coords.accuracy||0)} m`);
  if(document.getElementById('followGps').checked) map.setView(ll,Math.max(map.getZoom(),14));
}
function gpsError(err){
  alert('GPS indisponível neste modo. Abra este mapa por um endereço HTTPS no Chrome e permita Localização. O navegador interno do WhatsApp e arquivos content:// podem bloquear o GPS.');
}
document.getElementById('gpsBtn').onclick=()=>{
  if(!navigator.geolocation){ alert('Este navegador não oferece geolocalização.'); return; }
  navigator.geolocation.getCurrentPosition(p=>{showPos(p); map.setView([p.coords.latitude,p.coords.longitude],15);},gpsError,{enableHighAccuracy:true,timeout:15000,maximumAge:3000});
  if(watchId===null) watchId=navigator.geolocation.watchPosition(showPos,gpsError,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
};

L.control.layers({"Satélite + nomes":imagery,"Mapa de ruas":osm},{"Rótulos":labels,"Rota":routeGroup,"Pontos":markerGroup},{collapsed:false}).addTo(map);
L.control.scale({metric:true,imperial:false}).addTo(map);
</script>
